<!-- Vista: usuarios.html -->
<div class="h-100 d-flex flex-column bg-light pb-safe">
    
    <!-- Encabezado Fijo -->
    <div class="position-relative w-100 flex-shrink-0 p-4" style="background: linear-gradient(135deg, #0d6efd, #0dcaf0); border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; z-index: 10;">
        <div class="d-flex align-items-center mb-2 mt-2">
            <button class="btn btn-light rounded-circle shadow-sm me-3" onclick="history.back()" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;">
                <i class="bi bi-arrow-left text-primary"></i>
            </button>
            <h3 class="fw-bold text-white mb-0">La Tribu</h3>
        </div>
        <p class="text-white-50 small mb-0 ms-1">Ranking y miembros activos.</p>
        
        <!-- Buscador Integrado -->
        <div class="mt-3">
            <div class="input-group shadow-sm rounded-pill overflow-hidden bg-white">
                <span class="input-group-text bg-transparent border-0 text-muted ps-3 py-2">
                    <i class="bi bi-search"></i>
                </span>
                <input type="text" class="form-control border-0 py-2 shadow-none" id="buscador-usuarios" placeholder="Buscar por nombre..." onkeyup="window.filtrarUsuariosLista()">
            </div>
        </div>
    </div>

    <!-- Contenedor de la Tabla (Desplazable) -->
    <div class="flex-grow-1 p-3 overflow-auto" style="margin-top: -15px;">
        <div class="table-responsive bg-white rounded-4 shadow-sm p-2 pt-3">
            <table class="table table-hover align-middle mb-0" style="font-size: 0.9rem;">
                <thead class="table-light">
                    <tr>
                        <th scope="col" class="text-center text-secondary border-0 rounded-start-pill" style="width: 40px;">#</th>
                        <th scope="col" class="text-secondary border-0">Usuario</th>
                        <th scope="col" class="text-center text-secondary border-0">Rol</th>
                        <th scope="col" class="text-end text-secondary border-0 rounded-end-pill">Acción</th>
                    </tr>
                </thead>
                <tbody id="tabla-usuarios-body">
                    <!-- El contenido se inyecta desde usuarios.js -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Pequeño script solo para el buscador visual -->
<script>
    window.filtrarUsuariosLista = function() {
        const filtro = document.getElementById('buscador-usuarios');
        if (!filtro) return;
        const texto = filtro.value.toLowerCase();
        
        const items = document.querySelectorAll('#tabla-usuarios-body .contacto-item');
        items.forEach(item => {
            const nombre = item.getAttribute('data-name') || '';
            item.style.display = nombre.includes(texto) ? '' : 'none';
        });
    };
</script>
