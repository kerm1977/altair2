<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRIBALs · Tribu de archivos</title>
<link rel="stylesheet" href="/ftp/ftplink.css">
</head>
<body>
<header class="tp-head">
  <div class="tp-logo">◈</div>
  <div class="tp-title">
    <h1>TRIBALs</h1>
    <p>Tribu de archivos · servidor local</p>
  </div>
</header>

<section class="tp-up">
  <label class="tp-zone" id="zone">
    <input type="file" id="file" multiple hidden>
    <strong>⬆ Subir archivos a la tribu</strong>
    <span>Toca para elegir o arrastra aquí — entran directo a la biblioteca</span>
  </label>
  <div class="tp-prog" id="prog" hidden>
    <div class="tp-prog-track"><div class="tp-prog-bar" id="progbar"></div></div>
    <span id="progtxt"></span>
  </div>
</section>

<main class="tp-list" id="list">
  <p class="tp-empty">Cargando la tribu…</p>
</main>

<footer class="tp-foot">
  TRIBALs · servidor LAN interno — solo visible para equipos de tu misma red
</footer>
<script src="/ftp/ftplink.js"></script>
</body>
</html>
